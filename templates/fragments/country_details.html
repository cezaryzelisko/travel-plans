<h2>{{ country.name }}</h2>

<b>Details</b>

<ul>
    <li>Code: {{ country.code }}</li>
    <li>Visited: {% if country.is_visited %} true {% else %} false {% endif %}</li>
    <ul>
        {% for tag in country.tags %}
        <li style="background-color: {{ tag.color }};">{{ tag.label }}</li>
        {% endfor %}
    </ul>
</ul>
