<h2>{{ operation }} country</h2>

<form hx-post="/countries" hx-target="#country-details-dialog-content" hx-swap="innerHTML">
    <label>
        Code
        <input type="text" readonly name="code" value="{{ country_code }}">
    </label>
    <label>
        Name
        <input type="text" name="name" required value="{{ country_name }}">
    </label>
    <fieldset>
        <legend>Tags</legend>
        {% for tag in tags %}
        <label>
            <input type="checkbox" name="tags" value="{{ tag.label }}">
            {{ tag.label }}
        </label>
        {% endfor %}
    </fieldset>

    <button type="submit">Save</button>
</form>
