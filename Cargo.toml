[package]
name = "travel-plans"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = { version = "0.16.1", features = ["serde_json"] }
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
